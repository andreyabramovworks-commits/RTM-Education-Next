server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /education-next/api/ {
        rewrite ^/education-next/api/(.*)$ /$1 break;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api:8000/;
    }

    location = /education-next/install {
        proxy_pass http://api:8000/auth/install;
    }

    location = /install {
        proxy_pass http://api:8000/auth/install;
    }

    location = /education-next/app {
        proxy_pass http://api:8000/auth/app$is_args$args;
    }

    location = /app {
        proxy_pass http://api:8000/auth/app$is_args$args;
    }

    location / {
        try_files $uri /index.html;
    }
}
