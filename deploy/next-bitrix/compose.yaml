name: rtm-education-next
services:
  bitrix-entry:
    image: python:3.12-alpine
    command: python /app/server.py
    volumes:
      - ./server.py:/app/server.py:ro
      - ./data:/data
    env_file:
      - .env
    ports:
      - "127.0.0.1:18092:8000"
    restart: unless-stopped
    networks:
      - default
      - rtm_proxy
networks:
  rtm_proxy:
    external: true
    name: rtm-education_internal
